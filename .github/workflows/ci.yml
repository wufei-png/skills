name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Test repository contracts
        run: python3 -m unittest discover -s tests/repository-contract -p 'test_*.py' -v
      - name: Verify pinned skill discovery
        run: python3 tests/repository-contract/verify_installer.py --package skills@1.9.0
      - name: Test DocMate
        run: python3 -m unittest discover -s tests/docmate -p 'test_*.py' -v
      - name: Test documentation context checks
        run: python3 -m unittest discover -s tests/docs-context-curator -p 'test_*.py' -v
      - name: Check local documentation links
        run: >-
          python3 skills/engineering/docs-context-curator/scripts/doc_checks.py links
          --root . --path README.md --path README_CN.md --path AGENTS.md
          --path skills --path docs
      - name: Test Suno Create browser adapters
        run: node --test tests/suno-create/*.test.mjs
      - name: Test Codex session recovery
        run: python3 -m unittest discover -s tests/codex-session-recovery -p 'test_*.py' -v
      - name: Test OpenCode session toolkit
        run: python3 -m unittest discover -s tests/opencode-session-toolkit -p 'test_*.py' -v
      - name: Test Suno music explorer ledger
        run: python3 -m unittest discover -s tests/suno-music-explorer -p 'test_*.py' -v
      - name: Test Suno Studio downloads
        run: python3 -m unittest discover -s tests/suno-studio-download -p 'test_*.py' -v
      - name: Install Ruff
        run: python3 -m pip install --disable-pip-version-check ruff==0.16.5
      - name: Lint Python
        run: ruff check skills tests
      - name: Check Python formatting
        run: ruff format --check .

  skills-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Verify latest skill discovery
        run: python3 tests/repository-contract/verify_installer.py --package skills@latest
